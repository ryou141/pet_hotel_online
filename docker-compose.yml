version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: pawhotel_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pawhotel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawhotel_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pawhotel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pawhotel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      network: host
    container_name: pawhotel_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: pawhotel_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  rtmp:
    image: tiangolo/nginx-rtmp
    container_name: pawhotel_rtmp
    restart: always
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./nginx-rtmp.conf:/etc/nginx/nginx.conf

volumes:
  postgres_data: